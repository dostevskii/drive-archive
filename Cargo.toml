[package]
name = "drive-archive"
version = "0.1.0"
edition = "2024"
description = "외장하드에 흩어진 자료를 인덱싱하고, 하드를 연결하지 않아도 검색할 수 있게 해주는 Windows 11 전용 도구"
license = "GPL-3.0-only"
repository = "https://github.com/dostevskii/drive-archive"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
jwalk = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
