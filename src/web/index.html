<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIVE-ARCHIVE</title>
<style>
  /* 폰트는 실행 파일에 들어 있고 서버가 /font.woff2로 내려준다. */
  @font-face {
    font-family: 'FiraD2';
    src: url('/font.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  :root {
    --blue: #000fc0;   /* 바탕 */
    --fg:   #ffffff;   /* 글자 */
    --bar:  #dee0de;   /* 반전 막대 (타이틀·검색·선택 행) */
    --cols: 41;        /* 화면의 가로 칸 수. 시안이 41칸이다. */
    /* 고정폭 한 칸의 폭 ÷ 글자 크기. 위 Step 1에서 실측한 값이다.
       41칸이 화면에 정확히 들어가야 해서 추정값을 쓰지 않는다. */
    --ratio: 0.6154;
    /* 좌우 여백의 합. body padding과 맞춰 둔다. */
    --pad: calc(min(81px, 6vw) + 24px);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--blue);
    color: var(--fg);
    /* 데스크톱은 18px 그대로다. 화면이 좁아지면 41칸이 들어가는 크기까지 줄인다.
       칸 수를 줄이지 않는 이유는 표 그리기가 전부 41칸을 전제로 짜여 있어서다. */
    font-size: min(18px, calc((100vw - var(--pad)) / (var(--cols) * var(--ratio))));
    line-height: var(--line);
    font-family: 'FiraD2', 'D2Coding', 'Consolas', monospace;
    /* 시안의 좌 여백 81px. 화면이 좁으면 줄인다. */
    padding: 42px 24px 42px min(81px, 6vw);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    /* 휴대폰 브라우저가 글자를 임의로 부풀리지 않게 한다. 첫 진입 때 화면이
       확대되어 보이던 관찰의 예방책이다 — 크기는 위 font-size 계산만이 정한다. */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    --line: 1.1667em;   /* 21px / 18px. 글자 크기가 줄면 줄 높이도 따라 준다 */
  }

  /* 화면 전체가 41칸 폭을 넘지 않는다. TUI 한 컬럼처럼 보이게 하는 핵심이다. */
  .col { width: calc(var(--cols) * 1ch); max-width: 100%; }

  /* 반전 막대 — 밝은 바탕에 파란 글씨.
     `flex: none`이 없으면 목록이 길어질 때 body(flex 컨테이너)가 이 막대를
     세로로 눌러 버린다. 막대만 얇아지고 글자가 파란 바탕으로 삐져나온다. */
  .bar {
    background: var(--bar);
    color: var(--blue);
    height: var(--line);
    flex: none;
    white-space: pre;
    overflow: hidden;
  }

  .spacer { height: var(--line); flex: none; }

  pre.deco {
    margin: 0;
    font: inherit;
    flex: none;
    white-space: pre;
  }

  /* ── 검색 줄 ───────────────────────────────────────── */
  #searchbar { position: relative; cursor: text; }

  /* 실제 입력은 보이지 않는 input이 받는다. IME(한글) 조합을 브라우저에
     맡기기 위해서다. 화면에 보이는 글자와 커서는 아래에서 직접 그린다. */
  #keeper {
    position: absolute;
    inset: 0;
    width: 100%;
    border: 0;
    padding: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font: inherit;
    outline: none;
  }

  /* iOS Safari는 포커스된 입력칸의 글자가 16px보다 작으면 화면을 확대한다.
     좁은 화면에서는 계산된 글자 크기가 그 아래로 내려가 가상 키보드가 뜰 때
     페이지가 살짝 커진다. 이 입력칸은 어차피 투명이고 보이는 글자는 따로
     그리므로, 터치 기기에서만 16px로 고정해 확대를 막는다. 대가는 긴 검색어
     중간을 탭했을 때 커서가 몇 글자 어긋날 수 있다는 것 — 핀치 줌을 막는
     maximum-scale보다 낫다. */
  @media (pointer: coarse) {
    #keeper { font-size: 16px; }
  }

  #shown { position: relative; pointer-events: none; }

  /* 비밀번호 별표. 조합 기능(liga·calt)을 꺼야 한다 — Fira Code 계열은 연속된
     별표를 문맥에 따라 재배치해서, 켜 두면 글자 수마다 별표 높이가 널뛴다
     (아이폰 실측). 꺼진 기본 글리프는 이미 줄 가운데라 높이 보정은 두지 않는다. */
  #shown .mask {
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0;
  }

  #cursor {
    position: absolute;
    top: 0;
    width: 1ch;
    height: var(--line);
    background: var(--blue);
  }
  /* 깜빡임은 입력 중일 때만. step-end라 부드럽게 사라지지 않고 툭툭 끊긴다. */
  #cursor.blink { animation: blink 1.06s step-end infinite; }
  #cursor.hidden { display: none; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* ── 표 ────────────────────────────────────────────── */
  #rule, #head { white-space: pre; flex: none; }

  /* 높이는 JS(fitList)가 줄 높이의 정수배로 고정한다. 그래야 마지막 줄이
     반만 보이는 일이 없다. 남는 몇 픽셀은 그냥 바탕으로 둔다. */
  #list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #list::-webkit-scrollbar { width: 0; }

  .row {
    display: grid;
    height: var(--line);
    white-space: pre;
    cursor: pointer;
  }
  .row > span { overflow: hidden; }
  .row.drive  { grid-template-columns: 12ch 13ch 9ch 7ch; }
  /* 하드 이름 칸의 폭은 실제 이름 길이에 맞춰 정한다(paintHead 참고).
     그래야 이름 끝이 표의 오른쪽 끝에 맞고, 헤더 HDD가 그 첫 글자와 나란해진다. */
  .row.hit    { grid-template-columns: var(--name-w) var(--hdd-w); }
  .row.browse { grid-template-columns: calc(var(--cols) * 1ch - 9ch) 9ch; }
  .num  { text-align: right; }
  .sel  { background: var(--bar); color: var(--blue); }
  /* 연결되지 않은 하드는 한 단계 죽여서 표시한다. 지금 열 수 없다는 뜻이다. */
  .off  { opacity: 0.55; }
  .sel.off { opacity: 1; }

  .note { white-space: pre; opacity: 0.75; }

  /* 아래에 더 있다는 표시. 자리는 늘 차지하고 보이기만 껐다 켠다.
     숨길 때 없애 버리면 목록 높이가 바뀌어 화면이 출렁인다.
     반전은 줄 전체가 아니라 글자에만 준다. */
  #more { height: var(--line); flex: none; white-space: pre; text-align: center; }
  #more span { background: var(--bar); color: var(--blue); }
  #more.off { visibility: hidden; }

  /* ── 하단 상태 ─────────────────────────────────────── */
  #status { flex: none; margin-top: var(--line); }
  /* 경로는 41칸을 넘겨도 좋다. 이 줄이 화면의 결론이라 잘리면 쓸모가 없다. */
  #where  { white-space: pre; overflow: hidden; text-overflow: ellipsis; height: var(--line); }
  #vim    { white-space: pre; cursor: pointer; display: inline-block; }
  #mode   { white-space: pre; }

  /* ── 비밀번호 게이트 ───────────────────────────────── */
  /* 비밀번호를 묻는 동안에는 표와 목록을 감춘다. 자리는 남겨 두지 않는다 —
     빈 표가 보이면 뒤에 뭔가 있다는 인상을 준다. */
  body.gate #rule,
  body.gate #head,
  body.gate #list,
  body.gate #more,
  body.gate #vim,
  body.gate #mode { display: none; }

  /* `#where`는 남긴다. 틀렸다는 것과 잠금이 얼마나 남았는지 적을 자리가 필요하고,
     그 줄에는 인덱스 내용이 들어가지 않는다. */

  /* 게이트에서는 안내문이 이 화면의 결론이다. 평소의 한 줄 말줄임(긴 경로용)을
     풀고, 좁은 화면에서 41칸을 넘으면 줄을 바꿔 끝까지 보여 준다. */
  body.gate #where {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    text-overflow: clip;
    height: auto;
    min-height: var(--line);
  }
</style>
</head>
<body>

  <div class="bar col" id="title">DRIVE-ARCHIVE</div>
  <div class="spacer"></div>

  <pre class="deco col">ABCDEFGHIJKLMNOPQRSTU
VWXYZ0123456789&amp;-:.+=
()[]&lt;&gt;/\,--:--<span id="clock">--:--__</span></pre>
  <div class="spacer"></div>

  <!-- 이 줄은 `white-space: pre`라 태그 사이의 줄바꿈·들여쓰기가 그대로 글자로 찍힌다.
       한 줄로 붙여 쓴 것은 그래서다. 줄을 나누지 말 것. -->
  <div class="bar col" id="searchbar"><span id="shown">SEARCH:</span><span id="cursor"></span><input id="keeper" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <div class="spacer"></div>

  <div class="col" id="rule"></div>
  <div class="col" id="head"></div>
  <div class="spacer"></div>

  <div class="col" id="list"></div>
  <div class="col off" id="more"><span>-- MORE --</span></div>

  <div id="status">
    <div id="where"></div>
    <div id="vim">VIM MODE  [OFF]</div>
    <div id="mode">--INSERT--</div>
  </div>

<script>
"use strict";

const COLS = 41;
const SIZE_W = 9;                      // 탐색 화면의 크기 칸

/** 위로 올라가는 줄. 파일 브라우저의 `..` 그대로다. */
const UP_ROW = { name: '..', is_dir: true, up: true };

const SEP = '\\';                      // 인덱스에 저장된 경로 구분자

// 터치 기기인가. 데스크톱과 달리 포커스가 곧 가상 키보드라, 포커스를 함부로
// 돌려주면 목록을 만질 때마다 화면 반이 키보드에 가려진다.
const COARSE = window.matchMedia('(pointer: coarse)').matches;

const el = {
  clock:  document.getElementById('clock'),
  bar:    document.getElementById('searchbar'),
  shown:  document.getElementById('shown'),
  cursor: document.getElementById('cursor'),
  keeper: document.getElementById('keeper'),
  rule:   document.getElementById('rule'),
  head:   document.getElementById('head'),
  list:   document.getElementById('list'),
  where:  document.getElementById('where'),
  more:   document.getElementById('more'),
  vim:    document.getElementById('vim'),
  mode:   document.getElementById('mode'),
};

const state = {
  origin: null,    // 검색 결과에서 폴더로 들어온 자리 { serial, dir, sel }
  hitsTruncated: false, // 검색 결과가 상한에 걸렸는지 (탐색 중에도 잃지 않게 따로 둔다)
  drives: [],      // 검색 전 기본 화면에 뿌리는 하드 목록
  hits:   [],      // 검색 결과
  items:  [],      // 폴더를 펼쳐 본 내용
  browse: null,    // 지금 보고 있는 위치 { serial, label, dir }
  rows:   [],      // 지금 화면에 뿌려진 행 (drives · hits · items)
  kind:   'drive', // 'drive' | 'hit' | 'browse'
  sel:    0,
  vim:    false,   // VIM 모드 켬/끔
  insert: true,    // 입력 중인가 (VIM이 꺼져 있으면 항상 참)
  note:   '',      // 표 대신 띄울 안내 문구
  truncated: false, // 결과가 상한에 걸려 잘렸는가
  gate:   false,   // 비밀번호를 묻는 중인가
};

/* ── 글자 폭 ────────────────────────────────────────────
   고정폭 폰트에서도 한글은 영문의 두 칸을 차지한다. 커서를 글자 위에
   정확히 얹으려면 칸 수로 세야 한다.                                */

function isWide(cp) {
  return (cp >= 0x1100 && cp <= 0x115f) || (cp >= 0x2e80 && cp <= 0x303e) ||
         (cp >= 0x3041 && cp <= 0x33ff) || (cp >= 0x3400 && cp <= 0x4dbf) ||
         (cp >= 0x4e00 && cp <= 0x9fff) || (cp >= 0xa000 && cp <= 0xa4cf) ||
         (cp >= 0xac00 && cp <= 0xd7a3) || (cp >= 0xf900 && cp <= 0xfaff) ||
         (cp >= 0xfe30 && cp <= 0xfe6f) || (cp >= 0xff00 && cp <= 0xff60) ||
         (cp >= 0xffe0 && cp <= 0xffe6) || (cp >= 0x20000 && cp <= 0x3fffd);
}

function width(s) {
  let w = 0;
  for (const ch of s) w += isWide(ch.codePointAt(0)) ? 2 : 1;
  return w;
}

/** 표시 폭이 max 칸을 넘으면 잘라내고 끝에 `~`를 붙인다. */
function fit(s, max) {
  if (width(s) <= max) return s;
  let out = '', w = 0;
  for (const ch of s) {
    const cw = isWide(ch.codePointAt(0)) ? 2 : 1;
    if (w + cw > max - 1) break;
    out += ch; w += cw;
  }
  return out + '~';
}

/** 텍스트를 가운데 두고 좌우를 `-`로 채워 COLS 칸을 만든다. */
function rule(label) {
  const inner = ' ' + label + ' ';
  const pad = COLS - width(inner);
  if (pad <= 0) return fit(label, COLS);
  const left = Math.ceil(pad / 2);
  return '-'.repeat(left) + inner + '-'.repeat(pad - left);
}

const comma = n => n.toLocaleString('en-US');

/** 바이트를 사람이 읽는 크기로. 칸이 좁으므로 짧게 적는다. */
function humanSize(b) {
  if (b < 1024) return b + ' B';
  const unit = ['KB', 'MB', 'GB', 'TB'];
  let v = b / 1024, i = 0;
  while (v >= 1024 && i < unit.length - 1) { v /= 1024; i++; }
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + unit[i];
}

/** 지금 줄 높이(px). 글자 크기가 화면 폭에 따라 달라지므로 상수로 둘 수 없다. */
function lineH() {
  return parseFloat(getComputedStyle(document.body).lineHeight) || 21;
}

/** 목록 높이를 줄 높이의 정수배로 고정한다. 마지막 줄이 반만 보이지 않게. */
function fitList() {
  // 게이트에서는 목록이 display:none이라 높이가 0으로 재지고, Math.max(1, 0)이
  // 1줄로 굳는다. 게이트 중의 resize(iOS 키보드 등)가 이 값을 남기면 로그인
  // 뒤에도 한 줄만 보인다. 게이트에서는 재지 않고, 나갈 때 다시 잰다.
  if (state.gate) return;
  const line = lineH();
  el.list.style.flex = '1 1 auto';
  el.list.style.height = '';
  const rows = Math.max(1, Math.floor(el.list.clientHeight / line));
  el.list.style.flex = 'none';
  el.list.style.height = `${rows * line}px`;
}

/* ── 시계 ──────────────────────────────────────────────
   시안의 `08:49PM` 자리다. 이 자리만 진짜 시각이다.                  */

function tick() {
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const mm = String(d.getMinutes()).padStart(2, '0');
  el.clock.textContent = `${String(h).padStart(2, '0')}:${mm}${ampm}`;
}

/* ── 검색 줄 그리기 ─────────────────────────────────── */

const SEARCH_PROMPT   = 'SEARCH: ';
const PASSWORD_PROMPT = 'PASSWORD: ';

function prompt_() { return state.gate ? PASSWORD_PROMPT : SEARCH_PROMPT; }

/** 화면에 그릴 입력 글자. 비밀번호는 별표로 가린다. */
function shownValue(s) {
  return state.gate ? '*'.repeat([...s].length) : s;
}

function paintSearch() {
  const value = el.keeper.value;
  if (state.gate) {
    // '*' 글리프는 글꼴에서 위첨자 높이에 붙어 있어 줄 가운데와 어긋나 보인다.
    // 흐름(칸 수)은 그대로 두고 그리기만 살짝 내려 맞춘다 (.mask 규칙).
    el.shown.textContent = prompt_();
    const m = document.createElement('span');
    m.className = 'mask';
    m.textContent = shownValue(value);
    el.shown.appendChild(m);
  } else {
    el.shown.textContent = prompt_() + value;
  }

  // 커서는 입력 지점 위에 놓는다. IME 조합 중에도 selectionStart가 따라온다.
  const at = el.keeper.selectionStart ?? value.length;
  const col = width(prompt_()) + width(shownValue(value.slice(0, at)));
  el.cursor.style.left = `${col}ch`;

  el.cursor.classList.toggle('hidden', !state.insert);
  el.cursor.classList.toggle('blink', state.insert);
}

/* ── 비밀번호 ──────────────────────────────────────── */

/** 게이트로 들어간다. 목록을 지우고 비밀번호를 묻는다. */
function showGate(note) {
  clearTimeout(searchTimer);   // 게이트 직전에 예약된 검색이 안내를 덮어쓰지 않게 한다
  state.gate = true;
  state.rows = [];
  state.hits = [];
  state.drives = [];
  state.browse = null;
  state.origin = null;
  document.body.classList.add('gate');
  el.keeper.value = '';
  paintList(); paintMore();   // 이전 목록을 DOM에서도 지운다. 가려 두는 것으로는 게이트의 의도에 못 미친다
  el.where.textContent = note || '';
  setInsert(true);
  paintSearch();
}

/** 게이트를 나간다. */
function leaveGate() {
  state.gate = false;
  document.body.classList.remove('gate');
  el.keeper.value = '';
  el.where.textContent = '';
  fitList();   // 게이트 동안 재지 못한 목록 높이를 이제 잰다
  paintSearch();
  loadDrives();
}

async function tryLogin() {
  const password = el.keeper.value;
  if (!password) return;
  el.where.textContent = '확인하는 중...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      body: JSON.stringify({ password }),
    });
    if (r.ok) { leaveGate(); return; }
    const data = await r.json().catch(() => ({}));
    el.keeper.value = '';
    paintSearch();
    if (r.status === 429) {
      el.where.textContent = `너무 여러 번 틀렸습니다. ${data.seconds || 60}초 뒤에 다시 시도하세요.`;
    } else if (r.status === 401) {
      el.where.textContent = 'WRONG PASSWORD';
    } else {
      el.where.textContent = `서버 오류입니다 (${r.status}). 서버 로그를 확인하세요.`;
    }
  } catch (e) {
    el.where.textContent = '연결할 수 없습니다: ' + e.message;
  }
}

/* ── 표 그리기 ─────────────────────────────────────── */

/** 하드 이름 칸의 폭. 가장 긴 이름에 맞추되 헤더 `HDD`보다는 좁히지 않는다. */
function hddWidth() {
  let w = 3;
  for (const h of state.hits) w = Math.max(w, width(h.drive_label));
  return Math.min(w, COLS - 8);   // 이름 칸이 다 먹히지 않게 상한을 둔다
}

function paintHead() {
  if (state.kind === 'drive') {
    el.rule.textContent = rule('INDEX');
    el.head.textContent =
      'HDD'.padEnd(12) + 'VOLUME'.padEnd(13) + 'FORMAT'.padEnd(9) + ' FOLDER';
    return;
  }

  if (state.kind === 'browse') {
    const n = state.items.length;
    const more = state.truncated ? '+' : '';
    el.rule.textContent = rule(n ? `${comma(n)}${more} ITEMS` : 'EMPTY');
    el.head.textContent = 'NAME'.padEnd(COLS - SIZE_W) + 'SIZE'.padStart(SIZE_W);
    return;
  }

  const n = state.hits.length;
  const more = state.truncated ? '+' : '';
  el.rule.textContent = rule(n ? `${comma(n)}${more} FOUND` : 'NOT FOUND');

  // 하드 이름 칸을 표의 오른쪽 끝에 붙인다. 헤더 `HDD`는 그 칸의 첫 글자
  // 자리에서 시작하므로 `Works D`의 `W`와 세로로 나란해진다.
  const w = hddWidth();
  el.list.style.setProperty('--name-w', `${COLS - w}ch`);
  el.list.style.setProperty('--hdd-w', `${w}ch`);
  el.head.textContent = 'NAME'.padEnd(COLS - w) + 'HDD';
}

function paintList() {
  el.list.textContent = '';

  if (state.note) {
    const d = document.createElement('div');
    d.className = 'note';
    d.textContent = state.note;
    el.list.appendChild(d);
    return;
  }

  state.rows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'row ' + state.kind;
    if (i === state.sel) div.classList.add('sel');

    let cells;
    if (state.kind === 'browse') {
      const label = row.up ? '..' : row.name + (row.is_dir ? '/' : '');
      cells = [
        [fit(label, COLS - SIZE_W - 1), ''],
        [row.up ? '' : (row.is_dir ? '--' : humanSize(row.size)), 'num'],
      ];
    } else if (state.kind === 'drive') {
      if (!row.connected) div.classList.add('off');
      cells = [
        [fit(row.label, 11), ''],
        [row.serial, ''],
        [fit(row.filesystem, 8), ''],
        [comma(row.dir_count), 'num'],
      ];
    } else {
      const w = hddWidth();
      cells = [
        // 이름과 하드 이름이 붙지 않도록 한 칸을 비워 둔다.
        [fit(row.name + (row.is_dir ? '/' : ''), COLS - w - 1), ''],
        [fit(row.drive_label, w), ''],
      ];
    }

    for (const [text, cls] of cells) {
      const s = document.createElement('span');
      if (cls) s.className = cls;
      s.textContent = text;
      div.appendChild(s);
    }

    div.addEventListener('mousedown', e => {
      e.preventDefault();   // 검색창의 포커스를 뺏지 않는다
      // 터치 기기에서는 반대로 포커스를 뗀다. 목록을 만졌는데 가상 키보드가
      // 뜨면 화면 반이 가려진다 — 키보드는 검색줄을 탭했을 때만 뜬다.
      if (COARSE) el.keeper.blur();
      // 이미 고른 줄을 다시 누르면 연다. 모바일에서 더블탭은 확대로 먹히기 때문이다.
      // 데스크톱에서도 같은 줄을 두 번 누르면 열리는데, 자연스러운 동작이라 그대로 둔다.
      if (state.sel === i) { enter(); return; }
      select(i);
      // 더블클릭 리스너는 따로 두지 않는다. 두 번째 mousedown이 이미 열기라서
      // 더블클릭도 그 경로로 열린다. 리스너를 따로 두면 같은 클릭의 dblclick이 —
      // 동기 이동으로 화면이 이미 바뀐 뒤 — 그 자리의 다른 줄에 새로 붙은
      // 리스너에서 한 번 더 발화해, ..를 더블클릭했는데 엉뚱한 하드가 열린다.
    });
    el.list.appendChild(div);
  });
}

/** 목록 아래에 아직 더 있으면 `-- MORE --`를 켠다. */
function paintMore() {
  const l = el.list;
  const hasMore = l.scrollHeight - l.scrollTop - l.clientHeight > 1;
  el.more.classList.toggle('off', !hasMore);
}

/** 선택된 항목이 어디에 있는지 하단에 알린다. 이 도구의 존재 이유다. */
function paintWhere() {
  const row = state.rows[state.sel];
  if (!row) { el.where.textContent = ''; return; }

  if (state.kind === 'drive') {
    el.where.textContent = row.connected
      ? `${row.label} : ${row.letter}: 연결됨 · ${comma(row.entry_count)}개 항목`
      : `${row.label} : 연결 안 됨 · ${comma(row.entry_count)}개 항목`;
  } else if (state.kind === 'browse') {
    // `..` 줄에 서 있으면 지금 보고 있는 폴더 자체를 가리킨다.
    const at = row.up ? state.browse.dir : row.path;
    el.where.textContent = `${state.browse.label} : ${SEP}${at}`;
  } else {
    el.where.textContent = `${row.drive_label} : ${SEP}${row.path}`;
  }
}

function paintStatus() {
  el.vim.textContent = `VIM MODE  [${state.vim ? 'ON' : 'OFF'}]`;
  el.mode.textContent = state.insert ? '--INSERT--' : '--NORMAL--';
}

function paintAll() {
  paintHead();
  paintList();
  paintWhere();
  paintStatus();
  paintSearch();
  paintMore();
}

/* ── 선택 이동 ─────────────────────────────────────── */

function select(i) {
  if (!state.rows.length) return;
  state.sel = Math.max(0, Math.min(state.rows.length - 1, i));
  paintList();
  paintWhere();
  const node = el.list.children[state.sel];
  if (node) node.scrollIntoView({ block: 'nearest' });
  paintMore();
}

/** 한 화면에 들어가는 행 수. 좌우 키가 한 화면씩 움직이는 데 쓴다. */
function page() {
  return Math.max(1, Math.round(el.list.clientHeight / lineH()));
}

/* ── 데이터 ────────────────────────────────────────── */

/** 인덱스를 읽는 요청. 세션이 끊겼으면 게이트로 돌려보낸다. */
async function api(url) {
  const r = await fetch(url);
  if (r.status === 401) {
    showGate('세션이 끝났습니다. 다시 로그인하세요.');
    throw new Error('로그인이 필요합니다');
  }
  return r.json();
}

async function loadDrives() {
  try {
    const data = await api('/api/drives');
    if (data.error) throw new Error(data.error);
    state.drives = data.drives;
    // 목록을 불러오는 동안 사용자가 이미 검색어를 쳤을 수 있다.
    // 그때 기본 화면으로 되돌리면 방금 띄운 결과가 지워진다.
    if (!el.keeper.value.trim()) {
      state.kind = 'drive';
      state.rows = state.drives;
      state.sel = 0;
      state.note = state.drives.length ? '' : '인덱싱된 하드가 없습니다.';
    }
  } catch (e) {
    if (state.gate) return;
    state.note = '인덱스를 읽을 수 없습니다: ' + e.message;
    state.rows = [];
  }
  paintAll();
}

let searchTimer = null;
let searchSeq = 0;

async function runSearch(q) {
  const seq = ++searchSeq;

  if (!q.trim()) {
    state.browse = null;
    state.origin = null;
    state.truncated = false;                 // 검색어를 지우면 기본 화면으로 돌아온다
    state.kind = 'drive';
    state.rows = state.drives;
    state.sel = 0;
    state.note = state.drives.length ? '' : '인덱싱된 하드가 없습니다.';
    paintAll();
    return;
  }

  try {
    const data = await api('/api/search?q=' + encodeURIComponent(q));
    if (seq !== searchSeq) return;   // 더 최근 검색이 이미 떠났다
    if (data.error) throw new Error(data.error);

    state.hits = data.hits;
    state.truncated = !!data.truncated;
    state.hitsTruncated = !!data.truncated;
    state.origin = null;
    state.kind = 'hit';
    state.rows = state.hits;
    state.sel = 0;
    state.note = state.hits.length ? '' : '찾은 것이 없습니다.';
  } catch (e) {
    if (state.gate) return;
    if (seq !== searchSeq) return;
    state.rows = [];
    state.note = '검색에 실패했습니다: ' + e.message;
  }
  paintAll();
}

/* ── 탐색 ─────────────────────────────────────────── */

/** 폴더 하나를 펼친다. 하드가 꽂혀 있지 않아도 인덱스에 남은 것을 보여 준다. */
async function openDir(serial, label, dir, from) {
  try {
    const q = `serial=${encodeURIComponent(serial)}&dir=${encodeURIComponent(dir)}`;
    const data = await api('/api/list?' + q);
    if (data.error) throw new Error(data.error);

    if (from) state.origin = from;   // 여기서 나가면 검색 결과로 되돌아간다
    state.browse = { serial, label, dir };
    state.items = data.items;
    state.truncated = !!data.truncated;
    state.kind = 'browse';
    state.rows = [UP_ROW, ...data.items];
    state.sel = 0;
    state.note = '';
  } catch (e) {
    if (state.gate) return;
    state.rows = [];
    state.note = '폴더를 열 수 없습니다: ' + e.message;
  }
  paintAll();
}

/** 한 단계 위로. 루트에서 더 올라가면 하드 목록으로 돌아간다. */
function goUp() {
  const b = state.browse;
  if (!b) return;

  // 검색 결과에서 들어온 폴더라면 상위 폴더가 아니라 그 결과로 돌아간다.
  // 더 깊이 들어갔다가 올라오는 길에도 이 자리에서 결과로 빠져나온다.
  const o = state.origin;
  if (o && o.serial === b.serial && o.dir === b.dir) return backToSearch();

  if (!b.dir) return showDrives();
  const cut = b.dir.lastIndexOf(SEP);
  openDir(b.serial, b.label, cut < 0 ? '' : b.dir.slice(0, cut));
}

/** 하드 목록 화면으로 되돌린다. */
/** 검색 결과 화면으로 되돌린다. 다시 조회하지 않고 들고 있던 것을 그대로 쓴다. */
function backToSearch() {
  state.sel = Math.min(state.origin.sel, Math.max(0, state.hits.length - 1));
  state.kind = 'hit';
  state.rows = state.hits;
  state.truncated = state.hitsTruncated;
  state.browse = null;
  state.origin = null;
  state.note = state.hits.length ? '' : '찾은 것이 없습니다.';
  paintAll();
}

function showDrives() {
  state.kind = 'drive';
  state.browse = null;
  state.origin = null;
  state.truncated = false;
  state.rows = state.drives;
  state.sel = 0;
  state.note = state.drives.length ? '' : '인덱싱된 하드가 없습니다.';
  paintAll();
}

/** 지금 줄을 연다. 하드면 그 루트를, 폴더면 그 안을 펼친다. */
function enter() {
  if (state.gate) { tryLogin(); return; }
  const row = state.rows[state.sel];
  if (!row) return;
  if (state.kind === 'drive') return openDir(row.serial, row.label, '');
  if (row.up) return goUp();
  if (!row.is_dir) return;            // 파일은 열어 볼 내용이 없다
  const from = state.kind === 'hit'
    ? { serial: row.drive_serial, dir: row.path, sel: state.sel }
    : null;
  openDir(row.drive_serial, row.drive_label, row.path, from);
}

function onInput() {
  paintSearch();
  if (state.gate) return;      // 비밀번호를 치는 중이다. 검색하지 않는다.
  clearTimeout(searchTimer);
  const q = el.keeper.value;
  searchTimer = setTimeout(() => runSearch(q), 140);
}

/* ── 모드 ──────────────────────────────────────────── */

function setInsert(on) {
  // VIM을 꺼 두면 언제나 입력 상태다. 검색창이 늘 살아 있다.
  state.insert = state.vim ? on : true;

  // NORMAL로 갈 때는 입력칸의 포커스를 반드시 뗀다. 포커스가 남아 있으면
  // 한글 IME가 그 칸을 붙들고 있어서, `j`가 `ㅓ` 조합으로 들어가 버린다.
  // 그러면 키 처리기가 `isComposing`에서 멈춰 hjkl이 아예 동작하지 않는다.
  if (state.insert) el.keeper.focus();
  else el.keeper.blur();

  paintStatus();
  paintSearch();
}

function toggleVim() {
  state.vim = !state.vim;
  setInsert(!state.vim ? true : false);   // 켜는 순간 NORMAL로 들어간다
}

el.list.addEventListener('scroll', paintMore);
el.vim.addEventListener('mousedown', e => { e.preventDefault(); toggleVim(); });
el.bar.addEventListener('mousedown', () => setInsert(true));

/* ── 키 ────────────────────────────────────────────── */

let composing = false;
el.keeper.addEventListener('compositionstart', () => { composing = true; });
el.keeper.addEventListener('compositionend',  () => { composing = false; onInput(); });
el.keeper.addEventListener('input', () => { if (!composing) onInput(); paintSearch(); });
el.keeper.addEventListener('click', paintSearch);

document.addEventListener('keydown', e => {
  // 한글 조합 중에는 어떤 키도 가로채지 않는다. 조합이 깨진다.
  if (composing || e.isComposing) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  const move = d => { e.preventDefault(); select(state.sel + d); };

  switch (e.key) {
    case 'ArrowDown':  return move(1);
    case 'ArrowUp':    return move(-1);
    case 'ArrowRight': if (!state.insert) return move(page());  break;
    case 'ArrowLeft':  if (!state.insert) return move(-page()); break;
    case 'Escape':
      // ESC는 VIM 모드를 켜면서 NORMAL로 들어간다. 마우스 없이도
      // hjkl을 쓸 수 있어야 하므로 켜져 있는지 따지지 않는다.
      if (state.gate) return;      // 게이트에서는 모드를 바꾸지 않는다
      e.preventDefault();
      state.vim = true;
      setInsert(false);
      return;
    case 'Enter':
      e.preventDefault();
      enter();
      return;
  }

  // INSERT 중이면 나머지 키는 모두 검색어다. 커서 위치만 다시 그린다.
  if (state.insert) { setTimeout(paintSearch, 0); return; }

  // 여기부터는 VIM NORMAL 모드다.
  switch (e.key) {
    case 'j': case 'J': return move(1);
    case 'k': case 'K': return move(-1);
    case 'l': case 'L': return move(page());
    case 'h': case 'H': return move(-page());
    case 'g': e.preventDefault(); return select(0);
    case 'G': e.preventDefault(); return select(state.rows.length - 1);
    case 'i': case '/': e.preventDefault(); return setInsert(true);
  }
});

// 검색창 밖을 눌러도 입력이 이어지도록 포커스를 되돌린다.
// 터치 기기에서는 하지 않는다 — 포커스가 곧 가상 키보드라, 되돌리면 아무 데나
// 탭할 때마다 키보드가 올라온다. 검색줄 탭은 setInsert(true)가 따로 받는다.
document.addEventListener('mousedown', () => { if (state.insert && !COARSE) el.keeper.focus(); });

/* ── 시작 ──────────────────────────────────────────── */

window.addEventListener('resize', () => { fitList(); paintMore(); });

/** 세션이 있으면 목록을, 없으면 게이트를 띄운다. */
async function boot() {
  try {
    const r = await fetch('/api/drives');
    if (r.status === 401) { showGate(); return; }
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    state.drives = data.drives;
    state.kind = 'drive';
    state.rows = state.drives;
    state.note = state.drives.length ? '' : '인덱싱된 하드가 없습니다.';
  } catch (e) {
    state.note = '인덱스를 읽을 수 없습니다: ' + e.message;
    state.rows = [];
  }
  paintAll();
}

tick();
setInterval(tick, 1000);
fitList();
paintAll();
boot();
el.keeper.focus();
</script>
</body>
</html>
